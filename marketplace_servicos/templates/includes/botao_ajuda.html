{% if artigo_slug %}
<a
    href="{% url 'ajuda:artigo' artigo_slug %}"
    title="Ajuda sobre esta página"
    class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl
           border border-gray-200 dark:border-gray-700
           bg-white dark:bg-gray-800
           text-gray-700 dark:text-gray-200
           hover:bg-orange-50 dark:hover:bg-gray-700
           hover:border-orange-300 dark:hover:border-orange-500
           hover:text-orange-600 dark:hover:text-orange-400
           transition-all duration-200 shadow-sm group"
>
    <span
        class="flex items-center justify-center
               w-6 h-6 rounded-full
               border-2 border-orange-500
               text-orange-500
               text-sm font-bold leading-none
               group-hover:bg-orange-500
               group-hover:text-white
               transition-all duration-200"
    >
        ?
    </span>

    <span class="font-medium text-sm">
        Ajuda
    </span>
</a>

{% else %}

<a
    href="{% url 'ajuda:index' %}"
    title="Central de Ajuda"
    class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl
           border border-gray-200 dark:border-gray-700
           bg-white dark:bg-gray-800
           text-gray-700 dark:text-gray-200
           hover:bg-orange-50 dark:hover:bg-gray-700
           hover:border-orange-300 dark:hover:border-orange-500
           hover:text-orange-600 dark:hover:text-orange-400
           transition-all duration-200 shadow-sm group"
>
    <span
        class="flex items-center justify-center
               w-6 h-6 rounded-full
               border-2 border-orange-500
               text-orange-500
               text-sm font-bold leading-none
               group-hover:bg-orange-500
               group-hover:text-white
               transition-all duration-200"
    >
        ?
    </span>

    <span class="font-medium text-sm">
        Ajuda
    </span>
</a>

{% endif %}

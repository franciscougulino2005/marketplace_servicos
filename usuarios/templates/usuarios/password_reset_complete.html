{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center px-4 py-12">
    <div class="w-full max-w-md space-y-6 rounded-2xl bg-gray-800 p-8 shadow-xl border border-gray-700 text-center">
        <h2 class="text-2xl font-bold tracking-tight text-white">Senha alterada com sucesso!</h2>
        <p class="text-sm text-gray-300">
            Sua senha foi redefinida com êxito. Agora você já pode acessar sua conta utilizando sua nova credencial.
        </p>
        <div class="pt-4">
            <a href="{% url 'usuarios:login' %}" class="inline-block w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
                Ir para o login
            </a>
        </div>
    </div>
</div>
{% endblock %}

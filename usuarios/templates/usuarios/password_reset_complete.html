{% extends 'base.html' %}

{% block content %}

<div class="flex min-h-[80vh] items-center justify-center px-4 py-12">

    <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-xl dark:border-gray-700 dark:bg-gray-800">

        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-orange-100 dark:bg-orange-900/30">
            <svg
                class="h-8 w-8 text-orange-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                />
            </svg>
        </div>

        <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
            Senha alterada com sucesso!
        </h2>

        <p class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300">
            Sua senha foi redefinida com êxito. Agora você já pode acessar sua conta utilizando sua nova credencial.
        </p>

        <div class="pt-6">

            <a
                href="{% url 'usuarios:login' %}"
                class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-orange-500 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-all hover:bg-orange-600 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 dark:bg-orange-500 dark:hover:bg-orange-600 dark:focus:ring-orange-500 dark:focus:ring-offset-gray-800"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 19l-7-7 7-7"
                    />
                </svg>

                Ir para o login
            </a>

        </div>

    </div>

</div>

{% endblock %}
